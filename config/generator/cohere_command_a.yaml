init_args:
  _target_: models.generators.llm_openai.OpenAI
  # Cohere's OpenAI-compatibility endpoint (chat/completions)
  # pair with: retriever=api-embed-cohere-embed-multilingual-v3
  #            reranker=api-rerank-cohere-rerank-v3
  # .env: COHERE_API_KEY=..., LLM_BASE_URL=https://api.cohere.ai/compatibility/v1,
  #       LLM_API_KEY=${COHERE_API_KEY}  (see example.env "all-cohere" block)
  model_name: "command-a-03-2025"
  base_url: https://api.cohere.ai/compatibility/v1
  max_new_tokens: 512
  max_length: 128000
  batch_size: 1
