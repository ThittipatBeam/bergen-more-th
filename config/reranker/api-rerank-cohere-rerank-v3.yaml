init_args:
  _target_: models.rerankers.api_reranker.APIReranker
  model_name: "rerank-multilingual-v3.0"   # Cohere, multilingual (incl. Thai)
  provider: cohere
  max_retries: 6
  batch_pause: 0.0
  max_doc_chars: null
  dry_run: false
  require_confirmation: true
batch_size: 100   # (query, doc) pairs per DataLoader batch; one API call per unique query
