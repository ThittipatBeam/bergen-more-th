# main_config.yaml

defaults:
    - _self_
    - retriever: null
    - reranker: null
    - generator: null
    - dataset: ??
    - train: null
    - prompt: basic

# main variables locating the local data folder and index
run_name: null
dataset_folder: 'datasets/'
index_folder: 'indexes/'
runs_folder: 'runs/'
generated_query_folder: 'generated_queries/'
processed_context_folder: 'processed_contexts/'
experiments_folder: 'experiments/'   

# topk documents to retrieve, rerank and to use for generation
retrieve_top_k: 50
rerank_top_k: 50
generation_top_k: 5

# Thai-aware metrics (M_th, F1_th, Precision_th, Recall_th).
# null = auto: enabled when the dataset's language is Thai
# (dataset.<split>.query.init_args.lang == 'th').
# Override per run with thai_metrics=true / thai_metrics=false.
thai_metrics: null


#
pyserini_num_threads: 20
processing_num_proc: 40
hydra:
    job:
        chdir: False