# ==============================================================================
# BERGEN-TH: Batch Experiment & Model Sweep Configuration
# ==============================================================================
# Usage:
#   python3 scripts/run_sweep.py [--config sweep_config.yaml] [--dry-run] [--list]
# ==============================================================================

# Global defaults applied to every run (unless overridden)
defaults:
  dataset: "mkqa/thai_wiki_v4_qa.retrieve_th"
  
  # Default Retriever (Dense embedding via OpenAI-compatible endpoint)
  retriever: "api-embed-openai-compatible"
  retriever_model: "BAAI/bge-m3"
  retrieve_top_k: 100
  
  # Default Reranker (Cross-encoder reranking via /rerank endpoint)
  reranker: "api-rerank-openai-compatible"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  rerank_top_k: 10
  
  # Default Generator
  generator: "openai_compatible"
  generator_model: "DEEPSEEK-V4.1F"
  generation_top_k: 5

  # Default Judge (LLM-as-judge factuality evaluation)
  run_judge: false             # Automatically runs judge (evaluate.py --judge) after each run
  judge_model: "KIMI-K3"      # Model ID (matches JUDGE_MODEL in .env; e.g. KIMI-K3, gpt-4o-mini, etc.)
  
  thai_metrics: true          # Compute Thai-aware metrics (M_th, F1_th, etc.)
  auto_scan: true             # Update experiments_data.json after each run
  skip_existing: true         # Skip run if the finished experiment directory already exists
  split: "dev"                # Dataset split (usually 'dev')

# ------------------------------------------------------------------------------
# Option A: Matrix Mode (Auto-generate all 3-way combinations)
# ------------------------------------------------------------------------------
# When enabled: true, the runner generates the Cartesian product:
#   [Generators] x [Retrievers] x [Rerankers]
# Set enabled: false if you prefer running the explicit list in `runs:` below.
# ------------------------------------------------------------------------------
matrix:
  enabled: true              # Flip to true to test all combinations below automatically

  generators:
    - name: "DeepSeek-V4.1F"
      generator: "openai_compatible"
      model: "DEEPSEEK-V4.1F"
    - name: "Qwen-2.5-72B"
      generator: "openai_compatible"
      model: "Qwen/Qwen2.5-72B-Instruct"

  retrievers:
    - name: "BGE-M3"
      config: "api-embed-openai-compatible"
      model: "BAAI/bge-m3"
    - name: "Cohere-Embed"
      config: "api-embed-cohere-embed-multilingual-v3"
      model: "embed-multilingual-v3"

  rerankers:
    - name: "BGE-Rerank"
      config: "api-rerank-openai-compatible"
      model: "BAAI/bge-reranker-v2-m3"
    - name: "Cohere-Rerank"
      config: "api-rerank-cohere-rerank-v3"
      model: "rerank-multilingual-v3.0"
    - name: "No-Rerank"
      config: null
      model: null

# ------------------------------------------------------------------------------
# Option B: Explicit Combinations List (Hand-picked model swaps)
# ------------------------------------------------------------------------------
# Active when matrix.enabled is false.
# Each entry lets you mix & match any generator, retriever, and reranker.
# Toggle `enabled: true/false` to select what to run.
# ------------------------------------------------------------------------------
runs:
  # 1. DeepSeek + BGE-M3 Embed + BGE Rerank
  - name: "DeepSeek + BGE-M3 + BGE-Rerank"
    enabled: true
    generator: "openai_compatible"
    generator_model: "DEEPSEEK-V4.1F"
    retriever: "api-embed-openai-compatible"
    retriever_model: "BAAI/bge-m3"
    reranker: "api-rerank-openai-compatible"
    reranker_model: "BAAI/bge-reranker-v2-m3"

  # 2. DeepSeek + Cohere Embed + Cohere Rerank
  - name: "DeepSeek + Qwen-Embed + BGE Rerank"
    enabled: true
    generator: "openai_compatible"
    generator_model: "DEEPSEEK-V4.1F"
    retriever: "api-embed-openai-compatible"
    retriever_model: "QWEN3-EMBED-8B"
    reranker: "api-rerank-openai-compatible"
    reranker_model: "BAAI/bge-reranker-v2-m3"

  # 3. DeepSeek + Cohere Embed + BGE Rerank (Cross combination)
  - name: "Qwen3.6-27B + BGE-M3 + BGE-Rerank"
    enabled: true
    generator: "openai_compatible"
    generator_model: "QWEN3.6-27B"
    retriever: "api-embed-openai-compatible"
    retriever_model: "BAAI/bge-m3"
    reranker: "api-rerank-openai-compatible"
    reranker_model: "BAAI/bge-reranker-v2-m3"

  # 4. Qwen-2.5-72B + BGE-M3 + BGE Rerank
  - name: "Qwen3.6-27B + Qwen-Embed + BGE-Rerank"
    enabled: true
    generator: "openai_compatible"
    generator_model: "QWEN3.6-27B"
    retriever: "api-embed-openai-compatible"
    retriever_model: "QWEN3-EMBED-8B"
    reranker: "api-rerank-openai-compatible"
    reranker_model: "BAAI/bge-reranker-v2-m3"

  # # 5. Qwen-2.5-72B + Cohere Embed + Cohere Rerank
  # - name: "Qwen72B + Cohere-Embed + Cohere-Rerank"
  #   enabled: false
  #   generator: "openai_compatible"
