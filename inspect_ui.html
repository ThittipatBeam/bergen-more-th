<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Eval Inspector — MKQA Thai</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a;
    --fg: #e4e6eb; --muted: #8b8fa3; --accent: #6c8cff;
    --success: #4caf6d; --warning: #ff9800; --error: #f44336;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }

  /* Header */
  header { padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .chip { background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 20px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Layout */
  .container { display: flex; height: calc(100vh - 97px); }
  .sidebar { width: 340px; border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; flex-shrink: 0; }
  .main { flex: 1; overflow-y: auto; padding: 16px 24px; }

  /* Sidebar sections */
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.5px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=number], select {
    background: var(--bg); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .range-group { display: flex; gap: 8px; align-items: center; }
  .range-group span { font-size: 12px; color: var(--muted); min-width: 12px; text-align: center; }
  .btn {
    background: var(--accent); color: #fff; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%;
  }
  .btn:hover { opacity: 0.9; }
  .btn.secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }

  /* Stats cards */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; text-align: center;
  }
  .stat-card .value { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .stat-card .label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Histogram */
  .histogram { margin-bottom: 20px; }
  .histogram h4 { font-size: 13px; margin-bottom: 6px; font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 80px; }
  .bar {
    flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px;
    position: relative; cursor: pointer; opacity: 0.75;
  }
  .bar:hover { opacity: 1; }
  .bar .tooltip {
    display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); padding: 4px 8px;
    border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10;
  }
  .bar:hover .tooltip { display: block; }
  .histogram .labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

  /* Table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border); font-weight: 600; color: var(--muted);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--fg); }
  thead th .arrow { margin-left: 4px; font-size: 10px; }
  tbody td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: var(--surface); }
  .q-id { font-family: var(--mono); font-size: 11px; }
  .gt-badge {
    display: inline-block; width: 16px; height: 16px; line-height: 16px;
    text-align: center; border-radius: 50%; background: var(--error);
    color: #fff; font-size: 11px; font-weight: 700;
  }
  .metric-cell { font-family: var(--mono); text-align: right; }
  .score-0 { color: var(--error); }
  .score-low { color: var(--warning); }
  .score-mid { color: #ffc107; }
  .score-high { color: var(--success); }

  /* Pagination */
  .pagination { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .pagination button {
    background: var(--surface); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .pagination span { color: var(--muted); }

  /* Detail modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; justify-content: center; align-items: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    width: 90vw; max-width: 1200px; max-height: 90vh; overflow-y: auto;
    padding: 24px; position: relative;
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px; background: none; border: none;
    color: var(--muted); font-size: 24px; cursor: pointer;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; padding-right: 40px; }
  .modal .meta { display: flex; gap: 24px; margin-bottom: 16px; flex-wrap: wrap; }
  .modal .meta-item { font-size: 13px; }
  .modal .meta-item .k { color: var(--muted); font-size: 11px; display: block; margin-bottom: 2px; }
  .modal .metrics-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 8px; margin-bottom: 20px;
  }
  .modal .metric-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; text-align: center;
  }
  .modal .metric-box .mv { font-family: var(--mono); font-size: 15px; font-weight: 700; }
  .modal .metric-box .ml { font-size: 10px; color: var(--muted); }
  .modal .user-prompt, .modal .response-box, .modal .labels-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap;
    word-break: break-word; margin-bottom: 12px;
  }
  .modal .user-prompt h4, .modal .response-box h4, .modal .labels-box h4 {
    font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  .modal .user-prompt .content { max-height: 400px; overflow-y: auto; }

  /* Loading */
  .loading { text-align: center; padding: 40px; color: var(--muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <h1>RAG Eval Inspector</h1>
  <span class="chip" id="total-chip">Loading…</span>
</header>

<div class="tabs">
  <div class="tab active" data-tab="records">Records</div>
  <div class="tab" data-tab="stats">Statistics</div>
</div>

<div class="container">
  <!-- Sidebar: Filters -->
  <aside class="sidebar" id="sidebar">
    <div class="section">
      <h3>Search</h3>
      <input type="text" id="search" placeholder="Question, response, or label…">
    </div>
    <div class="section">
      <h3>M (mean metric) range</h3>
      <div class="range-group">
        <input type="number" id="min-m" placeholder="0" step="0.01" min="0">
        <span>–</span>
        <input type="number" id="max-m" placeholder="1" step="0.01" min="0">
      </div>
    </div>
    <div class="section">
      <h3>Recall_th range</h3>
      <div class="range-group">
        <input type="number" id="min-recall-th" placeholder="0" step="0.01" min="0">
        <span>–</span>
        <input type="number" id="max-recall-th" placeholder="1" step="0.01" min="0">
      </div>
    </div>
    <div class="section">
      <h3>Ground truth (qrel)</h3>
      <select id="has-ground-truth">
        <option value="">All</option>
        <option value="true" selected>Scorable (771)</option>
        <option value="false">No ground truth</option>
      </select>
    </div>
    <div class="section">
      <h3>Has label</h3>
      <select id="has-label">
        <option value="">All</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>
    <div class="section">
      <button class="btn" id="apply-filters">Apply Filters</button>
    </div>
    <div class="section">
      <button class="btn secondary" id="reset-filters">Reset</button>
    </div>
  </aside>

  <!-- Main: Records Table -->
  <main class="main" id="records-panel">
    <div class="loading" id="records-loading">Loading records…</div>
    <table id="records-table" style="display:none">
      <thead>
        <tr>
          <th data-sort="idx">#</th>
          <th title="Ground truth">GT</th>
          <th data-sort="q_id">ID</th>
          <th data-sort="question">Question</th>
          <th>Response</th>
          <th data-sort="M" class="metric-cell">M</th>
          <th data-sort="M_th" class="metric-cell">M_th</th>
          <th data-sort="Recall_th" class="metric-cell">Recall_th</th>
          <th data-sort="EM" class="metric-cell">EM</th>
        </tr>
      </thead>
      <tbody id="records-tbody"></tbody>
    </table>
    <div class="pagination" id="pagination" style="display:none">
      <button id="btn-prev">← Prev</button>
      <span id="page-info"></span>
      <button id="btn-next">Next →</button>
    </div>
  </main>

  <!-- Stats Panel -->
  <main class="main" id="stats-panel" style="display:none">
    <div class="stats-grid" id="stats-grid"></div>
    <div id="histograms"></div>
  </main>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <h2 id="modal-question"></h2>
    <div class="meta" id="modal-meta"></div>
    <div class="metrics-grid" id="modal-metrics"></div>
    <div class="response-box">
      <h4>Response</h4>
      <div id="modal-response"></div>
    </div>
    <div class="labels-box">
      <h4>Labels</h4>
      <div id="modal-labels"></div>
    </div>
    <div class="user-prompt">
      <h4>User Prompt (retrieved docs + question)</h4>
      <div class="content" id="modal-user-prompt"></div>
    </div>
  </div>
</div>

<script>
const PER_PAGE = 50;
let state = { page: 1, total: 0, sort_by: 'idx', sort_desc: false, filters: {} };
let statsData = null;

// --- Tabs ---
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    document.getElementById('records-panel').style.display = tab === 'records' ? 'block' : 'none';
    document.getElementById('stats-panel').style.display = tab === 'stats' ? 'block' : 'none';
    document.getElementById('sidebar').style.display = tab === 'records' ? 'block' : 'none';
    if (tab === 'stats' && !statsData) loadStats();
  });
});

// --- Load records ---
function loadRecords() {
  const params = new URLSearchParams({
    page: state.page,
    per_page: PER_PAGE,
    sort_by: state.sort_by,
    sort_desc: state.sort_desc,
    ...state.filters,
  });
  fetch(`/api/records?${params}`)
    .then(r => r.json())
    .then(data => {
      state.total = data.total;
      document.getElementById('total-chip').textContent = `${data.total} records`;
      renderTable(data.records);
      updatePagination();
    });
}

function renderTable(records) {
  const tbody = document.getElementById('records-tbody');
  tbody.innerHTML = '';
  records.forEach(rec => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="q-id">${rec.idx}</span></td>
      <td>${rec.has_ground_truth ? '' : '<span class="gt-badge" title="No ground truth in qrels">?</span>'}</td>
      <td><span class="q-id">${rec.q_id}</span></td>
      <td title="${esc(rec.question)}">${esc(rec.question)}</td>
      <td title="${esc(rec.response)}">${esc(truncate(rec.response, 60))}</td>
      <td class="metric-cell"><span class="${scoreClass(rec.metrics.M)}">${fmt(rec.metrics.M)}</span></td>
      <td class="metric-cell"><span class="${scoreClass(rec.metrics.M_th)}">${fmt(rec.metrics.M_th)}</span></td>
      <td class="metric-cell"><span class="${scoreClass(rec.metrics.Recall_th)}">${fmt(rec.metrics.Recall_th)}</span></td>
      <td class="metric-cell"><span class="${scoreClass(rec.metrics.EM)}">${fmt(rec.metrics.EM)}</span></td>
    `;
    tr.addEventListener('click', () => openModal(rec));
    tbody.appendChild(tr);
  });
  document.getElementById('records-loading').style.display = 'none';
  document.getElementById('records-table').style.display = 'table';
  document.getElementById('pagination').style.display = 'flex';
}

function updatePagination() {
  const pages = Math.ceil(state.total / PER_PAGE);
  document.getElementById('page-info').textContent = `Page ${state.page} / ${pages || 1}`;
  document.getElementById('btn-prev').disabled = state.page <= 1;
  document.getElementById('btn-next').disabled = state.page >= pages;
}

document.getElementById('btn-prev').addEventListener('click', () => { state.page--; loadRecords(); });
document.getElementById('btn-next').addEventListener('click', () => { state.page++; loadRecords(); });

// --- Sorting ---
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (state.sort_by === key) {
      state.sort_desc = !state.sort_desc;
    } else {
      state.sort_by = key;
      state.sort_desc = true;
    }
    state.page = 1;
    loadRecords();
  });
});

// --- Filters ---
document.getElementById('apply-filters').addEventListener('click', () => {
  state.page = 1;
  const f = {};
  const search = document.getElementById('search').value.trim();
  const minM = document.getElementById('min-m').value;
  const maxM = document.getElementById('max-m').value;
  const minR = document.getElementById('min-recall-th').value;
  const maxR = document.getElementById('max-recall-th').value;
  const hasLabel = document.getElementById('has-label').value;
  const hasGT = document.getElementById('has-ground-truth').value;
  if (search) f.search = search;
  if (minM) f.min_m = minM;
  if (maxM) f.max_m = maxM;
  if (minR) f.min_recall_th = minR;
  if (maxR) f.max_recall_th = maxR;
  if (hasLabel) f.has_label = hasLabel;
  if (hasGT) f.has_ground_truth = hasGT;
  state.filters = f;
  loadRecords();
});

document.getElementById('reset-filters').addEventListener('click', () => {
  ['search','min-m','max-m','min-recall-th','max-recall-th'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('has-label').value = '';
  document.getElementById('has-ground-truth').value = '';
  state.filters = {};
  state.page = 1;
  state.sort_by = 'idx';
  state.sort_desc = false;
  loadRecords();
});

// --- Modal ---
function openModal(rec) {
  document.getElementById('modal-question').textContent = rec.question;
  document.getElementById('modal-meta').innerHTML = `
    <div class="meta-item"><span class="k">Index</span>${rec.idx}</div>
    <div class="meta-item"><span class="k">Q-ID</span><span class="q-id">${rec.q_id}</span></div>
    <div class="meta-item"><span class="k">Labels</span>${rec.label.length}</div>
  `;
  const mg = document.getElementById('modal-metrics');
  mg.innerHTML = '';
  const keys = Object.keys(rec.metrics);
  keys.forEach(k => {
    const v = rec.metrics[k];
    mg.innerHTML += `<div class="metric-box"><div class="mv ${scoreClass(v)}">${fmt(v)}</div><div class="ml">${k}</div></div>`;
  });
  document.getElementById('modal-response').textContent = rec.response;
  document.getElementById('modal-labels').textContent = rec.label.join(', ') || '(none)';
  document.getElementById('modal-user-prompt').textContent = rec.user_prompt;
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('open');
});

// --- Stats ---
function loadStats() {
  fetch('/api/stats')
    .then(r => r.json())
    .then(data => {
      statsData = data;
      renderStats(data);
    });
}

function renderStats(data) {
  const sg = document.getElementById('stats-grid');
  sg.innerHTML = '';
  const metricKeys = Object.keys(data.overall);
  metricKeys.forEach(k => {
    const a = data.overall[k];
    const s = data.overall_scorable[k];
    const delta = s - a;
    sg.innerHTML += `<div class="stat-card">
      <div class="value ${scoreClass(s)}">${fmt(s)}</div>
      <div class="label">${k} (scorable)</div>
      <div class="label" style="margin-top:2px">all: ${fmt(a)} <span style="color:var(--success)">(+${delta.toFixed(2)})</span></div>
    </div>`;
  });
  document.querySelector('#stats-panel').insertAdjacentHTML('afterbegin',
    `<p style="margin-bottom:16px;color:var(--muted)">Scorable = ${data.scorable_count} questions with ground truth in qrels (of ${data.count} evaluated). Metrics on scorable subset are the honest Thai RAG numbers.</p>`);

  const hg = document.getElementById('histograms');
  hg.innerHTML = '<h3 style="margin-bottom:12px;font-size:15px;">Distributions (all records)</h3>';
  metricKeys.forEach(k => {
    const buckets = data.histograms[k];
    const maxCount = Math.max(...buckets.map(b => b.count));
    hg.innerHTML += `
      <div class="histogram">
        <h4>${k} (mean: ${fmt(data.overall[k])})</h4>
        <div class="bars">
          ${buckets.map(b => `
            <div class="bar" style="height:${(b.count / maxCount) * 80}px" title="${b.range}: ${b.count} records">
              <span class="tooltip">${b.range}: ${b.count}</span>
            </div>
          `).join('')}
        </div>
        <div class="labels"><span>${fmt(buckets[0].range_start)}</span><span>${fmt(buckets[buckets.length-1].range_end)}</span></div>
      </div>
    `;
  });
}

// --- Helpers ---
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function truncate(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function fmt(v) { return v.toFixed(4); }
function scoreClass(v) {
  if (v <= 0.15) return 'score-0';
  if (v <= 0.35) return 'score-low';
  if (v <= 0.60) return 'score-mid';
  return 'score-high';
}

// --- Init ---
loadRecords();
</script>
</body>
</html>
