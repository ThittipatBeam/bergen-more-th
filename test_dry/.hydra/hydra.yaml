hydra:
  run:
    dir: test_dry
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=test_dry
    - hydra.mode=RUN
    task:
    - dataset=mkqa/thai_wiki_v4_qa.retrieve_th
    - retriever=api-embed-openai-compatible
    - retriever.init_args.model_name=BAAI/bge-m3
    - reranker=api-rerank-openai-compatible
    - reranker.init_args.model_name=bge-reranker-v2-m3
    - generator=openai_compatible
    - generator.init_args.model_name=DEEPSEEK-V4.1F
    - retrieve_top_k=100
    - rerank_top_k=10
    - generation_top_k=5
  job:
    name: bergen
    chdir: false
    override_dirname: dataset=mkqa/thai_wiki_v4_qa.retrieve_th,generation_top_k=5,generator.init_args.model_name=DEEPSEEK-V4.1F,generator=openai_compatible,rerank_top_k=10,reranker.init_args.model_name=bge-reranker-v2-m3,reranker=api-rerank-openai-compatible,retrieve_top_k=100,retriever.init_args.model_name=BAAI/bge-m3,retriever=api-embed-openai-compatible
    id: ???
    num: ???
    config_name: rag
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.2'
    cwd: /home/beam/bergen-more-th
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/beam/bergen-more-th/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/beam/bergen-more-th/test_dry
    choices:
      prompt: basic
      train: null
      dataset: mkqa/thai_wiki_v4_qa.retrieve_th
      generator: openai_compatible
      reranker: api-rerank-openai-compatible
      retriever: api-embed-openai-compatible
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
